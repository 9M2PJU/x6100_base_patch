name: android-apk
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt update && sudo apt install -y openjdk-17-jdk unzip
      - run: bash app-android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: X6100-Uploader.apk
          path: app-android/bin/*.apk
